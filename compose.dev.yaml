# Автономный манифест локальной разработки Chatballs (HOM-58).
# docker compose -f compose.dev.yaml up -d --build --wait
services:
  secrets:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    entrypoint: ["/bin/sh", "/usr/local/bin/chatballs-generate-secrets.sh"]
    user: root
    restart: "no"
    volumes:
      - chatballs-secrets:/run/chatballs/secrets
      - chatballs-secrets-platform:/run/chatballs/secrets/platform
      - chatballs-secrets-schema:/run/chatballs/secrets/schema

  postgres:
    build:
      context: .
      dockerfile: deploy/docker/postgres.Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chatballs}
      POSTGRES_USER: ${POSTGRES_USER:-chatballs_bootstrap}
      POSTGRES_PASSWORD_FILE: /run/chatballs/secrets/schema/postgres_password
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-chatballs_app}
      POSTGRES_APP_PASSWORD_FILE: /run/chatballs/secrets/postgres_app_password
      POSTGRES_PLATFORM_USER: ${POSTGRES_PLATFORM_USER:-chatballs_platform}
      POSTGRES_PLATFORM_PASSWORD_FILE: /run/chatballs/secrets/platform/postgres_platform_password
      POSTGRES_MIGRATION_USER: ${POSTGRES_MIGRATION_USER:-chatballs_migration}
      POSTGRES_MIGRATION_PASSWORD_FILE: /run/chatballs/secrets/schema/postgres_migration_password
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - chatballs-secrets:/run/chatballs/secrets:ro
      - chatballs-secrets-platform:/run/chatballs/secrets/platform:ro
      - chatballs-secrets-schema:/run/chatballs/secrets/schema:ro
      - ./data/postgres:/var/lib/postgresql/data
    depends_on:
      secrets: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: ${CHATBALLS_REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # One-shot init: применяет миграции и сеет демоданные «Ателье Норд».
  init:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: "no"
    environment:
      CHATBALLS_DB_ROLE: migration
      CHATBALLS_DEBUG: "true"
      CHATBALLS_DELIVERY_MODE: ${CHATBALLS_DELIVERY_MODE:-CLOUD}
      CHATBALLS_HELP_BASE_DOMAIN: localhost
      CHATBALLS_HELP_PUBLIC_SCHEME: http
      CHATBALLS_HELP_PUBLIC_PORT: ""
    volumes:
      - chatballs-secrets:/run/chatballs/secrets:ro
      - chatballs-secrets-schema:/run/chatballs/secrets/schema:ro
      - ./apps/backend:/app/apps/backend
      - ./data/media:/app/apps/backend/media
    command: sh -c "python manage.py migrate --noinput && python manage.py ensure_dev_demo"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  backend-app:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    command: uvicorn chatballs_backend.asgi_app:application --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${BACKEND_APP_PORT:-8010}:8000"
    environment:
      CHATBALLS_DB_ROLE: app
      CHATBALLS_DEBUG: "true"
      CHATBALLS_DELIVERY_MODE: ${CHATBALLS_DELIVERY_MODE:-CLOUD}
      CHATBALLS_ALLOWED_HOSTS: "localhost,127.0.0.1,.localhost"
      CHATBALLS_HELP_BASE_DOMAIN: localhost
      CHATBALLS_HELP_PUBLIC_SCHEME: http
      CHATBALLS_HELP_PUBLIC_PORT: ""
    volumes:
      - chatballs-secrets:/run/chatballs/secrets:ro
      - chatballs-secrets-schema:/run/chatballs/secrets/schema:ro
      - chatballs-updates:/run/chatballs/updates
      - ./apps/backend:/app/apps/backend
      - ./data/media:/app/apps/backend/media
    depends_on:
      init: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; req = urllib.request.Request('http://127.0.0.1:8000/api/v1/health/live/', headers={'Host': os.environ.get('CHATBALLS_APP_HEALTHCHECK_HOST', 'app.localhost'), 'X-Forwarded-Proto': 'http'}); urllib.request.urlopen(req, timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend-platform:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    command: uvicorn chatballs_backend.asgi_platform:application --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${BACKEND_PLATFORM_PORT:-8011}:8000"
    environment:
      CHATBALLS_DB_ROLE: platform
      CHATBALLS_DEBUG: "true"
      CHATBALLS_DELIVERY_MODE: ${CHATBALLS_DELIVERY_MODE:-CLOUD}
      CHATBALLS_ALLOWED_HOSTS: "localhost,127.0.0.1,.localhost"
      CHATBALLS_HELP_BASE_DOMAIN: localhost
      CHATBALLS_HELP_PUBLIC_SCHEME: http
      CHATBALLS_HELP_PUBLIC_PORT: ""
    volumes:
      - chatballs-secrets:/run/chatballs/secrets:ro
      - chatballs-secrets-platform:/run/chatballs/secrets/platform:ro
      - ./apps/backend:/app/apps/backend
    depends_on:
      init: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; req = urllib.request.Request('http://127.0.0.1:8000/api/v1/health/live/', headers={'Host': os.environ.get('CHATBALLS_PLATFORM_HEALTHCHECK_HOST', 'platform.localhost'), 'X-Forwarded-Proto': 'http'}); urllib.request.urlopen(req, timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend-admin:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    command: uvicorn chatballs_backend.asgi_admin:application --host 0.0.0.0 --port 8000 --reload
    ports:
      - "127.0.0.1:${CHATBALLS_ADMIN_PORT:-18001}:8000"
    environment:
      CHATBALLS_DB_ROLE: migration
      CHATBALLS_DEBUG: "true"
      CHATBALLS_DELIVERY_MODE: ${CHATBALLS_DELIVERY_MODE:-CLOUD}
    volumes:
      - chatballs-secrets:/run/chatballs/secrets:ro
      - chatballs-secrets-schema:/run/chatballs/secrets/schema:ro
      - ./apps/backend:/app/apps/backend
    depends_on:
      init: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    command: ["python", "manage.py", "run_worker", "--role=poller"]
    environment:
      CHATBALLS_DB_ROLE: app
      CHATBALLS_DB_PLATFORM_ALIAS: "1"
      CHATBALLS_DEBUG: "true"
      CHATBALLS_DELIVERY_MODE: ${CHATBALLS_DELIVERY_MODE:-CLOUD}
    volumes:
      - chatballs-secrets:/run/chatballs/secrets:ro
      - chatballs-secrets-platform:/run/chatballs/secrets/platform:ro
      - ./apps/backend:/app/apps/backend
      - ./data/media:/app/apps/backend/media
    depends_on:
      backend-app: { condition: service_healthy }

  worker-events:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    command: ["python", "manage.py", "run_worker", "--role=events"]
    deploy:
      replicas: 1
    environment:
      CHATBALLS_DB_ROLE: app
      CHATBALLS_DB_PLATFORM_ALIAS: "1"
      CHATBALLS_DEBUG: "true"
      CHATBALLS_DELIVERY_MODE: ${CHATBALLS_DELIVERY_MODE:-CLOUD}
    volumes:
      - chatballs-secrets:/run/chatballs/secrets:ro
      - chatballs-secrets-platform:/run/chatballs/secrets/platform:ro
      - ./apps/backend:/app/apps/backend
      - ./data/media:/app/apps/backend/media
    depends_on:
      backend-app: { condition: service_healthy }

  updater:
    build:
      context: .
      dockerfile: deploy/docker/updater.Dockerfile
    restart: unless-stopped
    environment:
      CHATBALLS_UPDATE_REPO: ${CHATBALLS_UPDATE_REPO:-dartdavros/chatballs}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - chatballs-updates:/run/chatballs/updates
    depends_on:
      backend-app: { condition: service_healthy }

  frontend:
    build:
      context: .
      dockerfile: apps/internal-ui/Dockerfile
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0 --port 5173
    environment:
      VITE_DEV_API_TARGET: http://backend-app:8000
      VITE_DEV_POLL: "1"
    ports:
      - "${INTERNAL_UI_PORT:-5173}:5173"
    volumes:
      - ./apps/internal-ui:/app/apps/internal-ui
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/internal-ui/node_modules
    depends_on:
      backend-app: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/ || exit 0"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  web-chat:
    build:
      context: .
      dockerfile: apps/web-chat/Dockerfile
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0 --port 5175
    environment:
      VITE_DEV_POLL: "1"
    ports:
      - "${WEB_CHAT_PORT:-5175}:5175"
    volumes:
      - ./apps/web-chat:/app/apps/web-chat
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/web-chat/node_modules
    depends_on:
      backend-app: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5175/ || exit 0"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Dev-шлюз: nginx с локальной маршрутизацией HMR и WebSocket вместо Caddy.
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    command: ["nginx", "-g", "daemon off;"]
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend-app: { condition: service_healthy }
      backend-platform: { condition: service_healthy }
      frontend: { condition: service_started }
      web-chat: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 0"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  chatballs-secrets:
  chatballs-secrets-platform:
  chatballs-secrets-schema:
  chatballs-updates:
